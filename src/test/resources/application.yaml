spring:
  application:
    name: authentication_and_authorization_service

  datasource:
    driver-class-name: org.h2.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${MYSQL_USER:sa}
    password: ${MYSQL_PASSWORD:}
    jpa:
      hibernate:
        ddl-auto: update
      database-platform: org.hibernate.dialect.H2Dialect
    hikari:
      connection-timeout: 30000
    sql:
      init:
        mode: always
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db-migration

server:
  port: ${SERVER_PORT:1090}

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY:z7A9MqKJp/XFJ2Bjo5LD5UwDWG7VxDdZm+HzRYpO60Q=}
    expiration-time: 3600000
